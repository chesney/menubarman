[package]
name = "menubarman"
version = "0.1.0"
description = "Native macOS Menu Bar Manager & Notch Hidden Items Inspector"
authors = ["Chesney Carolissen"]
edition = "2021"
default-run = "menubarman"

[[bin]]
name = "menubarman"
path = "src/main.rs"

[lib]
name = "menubarman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "unwind"
strip = true
