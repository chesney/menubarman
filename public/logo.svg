<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(6,182,212,0.3)" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Tuxedo Gradient -->
    <linearGradient id="tuxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Base (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" filter="url(#softShadow)" />

  <!-- Ambient background glow behind barman -->
  <circle cx="256" cy="270" r="160" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />
  <circle cx="256" cy="180" r="100" fill="#f59e0b" opacity="0.06" filter="url(#glow)" />

  <!-- ==================== TOP: macOS MENU BAR WITH NOTCH ==================== -->
  <g id="menuBarStrip">
    <!-- Menu Bar Container -->
    <rect x="52" y="56" width="408" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" />
    
    <!-- Left Menu Items: Apple logo and mock menus -->
    <path d="M 76 72 C 78 70 81 71 83 73 C 85 71 88 70 90 72 C 92 75 91 80 87 84 C 85 86 83 86 82 86 C 81 86 79 86 77 84 C 73 80 73 74 76 72 Z" fill="#94a3b8" />
    <path d="M 83 69 C 84 67 85 66 84 64 C 82 64 81 66 81 67 C 82 68 83 69 83 69 Z" fill="#94a3b8" />
    <rect x="100" y="73" width="22" height="7" rx="3" fill="#64748b" />
    <rect x="128" y="73" width="18" height="7" rx="3" fill="#475569" />
    <rect x="152" y="73" width="20" height="7" rx="3" fill="#475569" />

    <!-- Center: MacBook Camera Notch -->
    <path d="M 226 56 L 286 56 L 282 76 C 281 80 277 83 273 83 L 239 83 C 235 83 231 80 230 76 Z" fill="#030712" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
    <circle cx="256" cy="69" r="3.5" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="264" cy="69" r="1.5" fill="#10b981" />

    <!-- Right Status Items: WiFi, Volume, Battery, Toggle -->
    <!-- WiFi wave -->
    <path d="M 364 77 A 6 6 0 0 1 372 77 M 361 74 A 10 10 0 0 1 375 74 M 358 71 A 14 14 0 0 1 378 71" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <circle cx="368" cy="80" r="1.2" fill="#38bdf8" />

    <!-- Battery -->
    <rect x="390" y="71" width="18" height="10" rx="2.5" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="392" y="73" width="10" height="6" rx="1" fill="#10b981" />
    <line x1="409" y1="74" x2="409" y2="78" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Toggle Dot / Control Center -->
    <circle cx="426" cy="76" r="4.5" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="438" cy="76" r="3.5" fill="#f59e0b" />
  </g>

  <!-- ==================== CENTER: THE BARMAN & SERVING TRAY ==================== -->
  
  <!-- Silver Cocktail Serving Platter (The Menu Bar Tray) -->
  <g id="servingPlatter" filter="url(#softShadow)">
    <!-- Platter Rim -->
    <ellipse cx="256" cy="180" rx="180" ry="24" fill="url(#tuxGrad)" stroke="url(#rimGrad)" stroke-width="3" />
    <ellipse cx="256" cy="178" rx="170" ry="20" fill="none" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" />
    
    <!-- Cocktail Glass & Shaker on Platter -->
    <!-- Martini Glass stem & base -->
    <path d="M 175 174 L 175 142 M 165 174 L 185 174" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Martini Glass bowl -->
    <path d="M 152 118 L 198 118 L 175 142 Z" fill="rgba(6, 182, 212, 0.2)" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
    <!-- Olive & skewer -->
    <line x1="162" y1="112" x2="186" y2="132" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="174" cy="122" r="4" fill="#10b981" />
    <!-- Cocktail liquid glow -->
    <path d="M 158 123 L 192 123 L 175 141 Z" fill="url(#cyanGrad)" opacity="0.75" />

    <!-- Shaker Body (Center Right) -->
    <path d="M 320 174 L 324 130 C 324 125 328 120 334 118 L 342 118 C 348 120 352 125 352 130 L 356 174 Z" fill="url(#tuxGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M 330 118 L 333 108 L 343 108 L 346 118 Z" fill="url(#goldGrad)" />
    <!-- Shaker detail band -->
    <line x1="322" y1="145" x2="354" y2="145" stroke="#f59e0b" stroke-width="2" />

    <!-- Menu Card (Center of Tray) -->
    <g transform="translate(230, 114)" filter="url(#softShadow)">
      <rect x="0" y="0" width="52" height="60" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Menu Header -->
      <rect x="8" y="8" width="36" height="5" rx="2" fill="#0f172a" />
      <line x1="10" y1="20" x2="42" y2="20" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
      <line x1="10" y1="27" x2="36" y2="27" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="10" y1="34" x2="40" y2="34" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="10" y1="41" x2="32" y2="41" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <line x1="10" y1="48" x2="38" y2="48" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <!-- Red Ribbon bookmark -->
      <path d="M 36 0 L 36 14 L 40 10 L 44 14 L 44 0 Z" fill="#ef4444" />
    </g>

    <!-- Floating Sparkles / Status dots hovering over tray -->
    <circle cx="210" cy="130" r="4" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="295" cy="126" r="3.5" fill="#f59e0b" filter="url(#glow)" />
    <circle cx="140" cy="145" r="2.5" fill="#10b981" />
  </g>

  <!-- ==================== THE BARMAN SILHOUETTE ==================== -->
  <g id="barmanFigure">
    <!-- Barman Tuxedo / Vest -->
    <path d="M 120 460 C 130 350 170 290 200 270 L 256 310 L 312 270 C 342 290 382 350 392 460 Z" fill="url(#tuxGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    
    <!-- White Shirt V-Neck & Collar -->
    <path d="M 216 260 L 256 310 L 296 260 L 280 230 L 256 250 L 232 230 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Shirt Collar Wings -->
    <polygon points="228,230 256,252 240,268" fill="#e2e8f0" />
    <polygon points="284,230 256,252 272,268" fill="#cbd5e1" />

    <!-- Dapper Gold / Amber Bow Tie -->
    <g id="bowTie" filter="url(#softShadow)">
      <!-- Left bow wing -->
      <polygon points="256,260 216,244 218,276" fill="url(#goldGrad)" />
      <!-- Right bow wing -->
      <polygon points="256,260 296,244 294,276" fill="url(#goldGrad)" />
      <!-- Bow knot -->
      <rect x="249" y="252" width="14" height="16" rx="3" fill="#d97706" stroke="#fbbf24" stroke-width="1" />
    </g>

    <!-- Tuxedo Lapels -->
    <path d="M 200 270 L 225 350 L 256 380 L 220 330 Z" fill="#111827" />
    <path d="M 312 270 L 287 350 L 256 380 L 292 330 Z" fill="#0f172a" />

    <!-- Tuxedo Buttons -->
    <circle cx="256" cy="340" r="3.5" fill="#f59e0b" />
    <circle cx="256" cy="375" r="3.5" fill="#f59e0b" />
    <circle cx="256" cy="410" r="3.5" fill="#f59e0b" />

    <!-- Barman Suave Mustache -->
    <g id="mustache" filter="url(#softShadow)" transform="translate(0, -6)">
      <path d="M 256 226 C 248 220 230 214 214 224 C 208 228 206 234 210 235 C 218 236 230 231 242 233 C 250 234 254 237 256 240 C 258 237 262 234 270 233 C 282 231 294 236 302 235 C 306 234 304 228 298 224 C 282 214 264 220 256 226 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Barman White Gloves holding the platter edge -->
    <!-- Left Hand -->
    <ellipse cx="140" cy="188" rx="16" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-15 140 188)" />
    <!-- Right Hand -->
    <ellipse cx="372" cy="188" rx="16" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(15 372 188)" />
  </g>

  <!-- Subtle bottom glow -->
  <ellipse cx="256" cy="470" rx="140" ry="8" fill="#06b6d4" opacity="0.3" filter="url(#glow)" />
</svg>
